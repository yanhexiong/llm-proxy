name: Update Worker

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out your deployment branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          path: instance
      - name: Download the latest prebuilt version
        uses: actions/checkout@v7.0.1
        with:
          repository: yanhexiong/llm-proxy
          ref: deploy
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Update application files and preserve instance settings
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node upstream/update-deploy-template.mjs --target instance --upstream upstream --commit
      - name: Push update for Cloudflare to deploy
        env:
          DEPLOYMENT_BRANCH: ${{ github.ref_name }}
        run: git -C instance push origin "HEAD:refs/heads/$DEPLOYMENT_BRANCH"
